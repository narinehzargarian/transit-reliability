[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-reliability"
version = "0.1.0"
description = "Measure how reliably buses and trains run, from any city's GTFS-Realtime feed, with Apache Spark."
readme = "README.md"
license = "MIT"
authors = [{ name = "Narineh Zargarian" }]
requires-python = ">=3.10"
dependencies = [
  "pyspark>=4.0,<4.1",
  "gtfs-realtime-bindings>=1.0.0",
  "protobuf>=4.21",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transit-reliability = "transit_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs LocalStack (set LOCALSTACK=1)"]
